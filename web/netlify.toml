# The production deploy uploads web/ as the package root, so no base here.
# A git-linked Netlify build from the repo root would set base = "web".
# The Next.js runtime plugin must be declared explicitly for zip deploys;
# without it Netlify publishes the raw .next directory and every route 404s.
[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Post-deadline follow-up: add a Content-Security-Policy once there is time
# to test it against Supabase, GSAP, and the media embeds.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
