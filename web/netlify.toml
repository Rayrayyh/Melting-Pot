# The production deploy uploads web/ as the package root, so no base here.
# A git-linked Netlify build from the repo root would set base = "web".
# The Next.js runtime plugin must be declared explicitly for zip deploys;
# without it Netlify publishes the raw .next directory and every route 404s.
[build]
  command = "pnpm build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# These rules reach only statically-served files; SSR responses get the same
# set (plus the Content-Security-Policy, which only matters on documents)
# from headers() in next.config.ts.
[[headers]]
  for = "/*"
  [headers.values]
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "DENY"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"
    X-Content-Type-Options = "nosniff"
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Resource-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
    X-XSS-Protection = "1; mode=block"
