<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&amp;family=Figtree:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
  html, body { margin: 0; padding: 0; background: #FCF7EE; }
  a { color: #C4570E; text-decoration: none; }
  a:hover { color: #A34608; }
  @keyframes mp-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  @keyframes mp-drift { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(-14px) rotate(6deg); } }
  @keyframes mp-drift2 { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(12px) rotate(-8deg); } }
  @keyframes mp-pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.12); opacity: 1; } }
</style>
</helmet>
<div data-screen-label="404 page" style="position: relative; min-height: 100vh; background: #FCF7EE; overflow: hidden; display: grid; place-items: center; font-family: Figtree, sans-serif;">
  <div style="position: absolute; top: 34px; left: 44px; display: flex; align-items: center; gap: 10px;">
    <div style="position: relative; width: 32px; height: 32px; background: #E58432; border-radius: 9px; display: grid; place-items: center; overflow: hidden;">
      <span style="font-family: Figtree, sans-serif; font-weight: 700; font-size: 18px; color: #FFFFFF; line-height: 1;">m</span>
      <img src="https://meltingpot-io.netlify.app/icon.svg" alt="" style="position: absolute; inset: 0; width: 32px; height: 32px; display: block;">
    </div>
    <span style="font-family: Figtree, sans-serif; font-weight: 700; font-size: 23px; color: #2E2A26; letter-spacing: -0.015em;">meltingpot</span>
  </div>
  <sc-if value="{{ showAccents }}" hint-placeholder-val="{{ true }}">
    <div style="position: absolute; top: 84px; left: 11%; width: 46px; height: 46px; background: #F0A24C; border-radius: 62% 38% 55% 45% / 55% 48% 52% 45%; animation: mp-drift 7s ease-in-out infinite;"></div>
    <div style="position: absolute; top: 190px; left: 6%; width: 18px; height: 18px; background: #E07E22; border-radius: 50%; animation: mp-pulse 5s ease-in-out infinite;"></div>
    <div style="position: absolute; top: 88px; right: 4%; width: 58px; height: 58px; background: #C4570E; border-radius: 43% 57% 48% 52% / 58% 44% 56% 42%; animation: mp-drift2 8s ease-in-out infinite;"></div>
    <div style="position: absolute; top: 250px; right: 5.5%; width: 14px; height: 14px; background: #F6C989; border-radius: 50%; animation: mp-pulse 6s ease-in-out infinite 1s;"></div>
    <div style="position: absolute; bottom: 150px; left: 9%; width: 34px; height: 52px; background: #E8933A; border-radius: 50% 50% 46% 54% / 62% 64% 36% 38%; animation: mp-drift 9s ease-in-out infinite 0.5s;"></div>
    <div style="position: absolute; bottom: 84px; left: 16%; width: 16px; height: 16px; background: #C4570E; border-radius: 50%; animation: mp-pulse 7s ease-in-out infinite 2s;"></div>
    <div style="position: absolute; bottom: 190px; right: 7%; width: 42px; height: 42px; background: #F0A24C; border-radius: 55% 45% 62% 38% / 46% 55% 45% 54%; animation: mp-drift2 7.5s ease-in-out infinite 1.2s;"></div>
    <div style="position: absolute; bottom: 96px; right: 13%; width: 20px; height: 20px; background: #E07E22; border-radius: 50%; animation: mp-pulse 5.5s ease-in-out infinite 0.7s;"></div>
    <div style="position: absolute; top: 52%; left: 3%; width: 12px; height: 12px; background: #F6C989; border-radius: 50%; animation: mp-pulse 6.5s ease-in-out infinite 1.6s;"></div>
    <div style="position: absolute; top: 46%; right: 3%; width: 10px; height: 10px; background: #E8933A; border-radius: 50%; animation: mp-pulse 8s ease-in-out infinite 0.3s;"></div>
  </sc-if>
  <div style="position: relative; display: flex; flex-direction: column; align-items: center; text-align: center; padding: 72px 24px 64px;">
    
    <sc-if value="{{ isMelty }}" hint-placeholder-val="{{ true }}">
      <div style="display: flex; align-items: center; justify-content: center; gap: 4px;">
      <span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 300px; line-height: 0.78; color: #C4570E; letter-spacing: -0.04em;">4</span>
      
      <img src="assets/pot-splash-cut.png" alt="MeltingPot pot spilling over" style="width: 540px; height: 476px; object-fit: contain; margin: 0 2px; animation: mp-bob 6s ease-in-out infinite;"><span style="font-family: 'Bricolage Grotesque', sans-serif; font-weight: 800; font-size: 300px; line-height: 0.78; color: #C4570E; letter-spacing: -0.04em;">4</span>
    </div><h1 style="margin: 44px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 44px; color: #3D2B1C; letter-spacing: -0.02em; line-height: 1.1;">This page melted away.</h1>
      <p style="margin: 18px 0 0; max-width: 480px; font-size: 18px; line-height: 1.6; color: #6B5744; text-wrap: pretty;">The page you're trying to reach doesn't exist or has been moved. Everything worth reading is back in the Pot.</p>
    </sc-if>
    <sc-if value="{{ isPlain }}" hint-placeholder-val="{{ false }}">
      <h1 style="margin: 44px 0 0; font-family: 'Bricolage Grotesque', sans-serif; font-weight: 700; font-size: 44px; color: #3D2B1C; letter-spacing: -0.02em; line-height: 1.1;">Page not found.</h1>
      <p style="margin: 18px 0 0; max-width: 480px; font-size: 18px; line-height: 1.6; color: #6B5744; text-wrap: pretty;">The page you're trying to reach doesn't exist or has been moved. Try heading back to the homepage.</p>
    </sc-if>
    <a href="https://meltingpot-io.netlify.app/" style="margin-top: 36px; display: inline-flex; align-items: center; gap: 10px; background: #E07E22; color: #FFFCF7; font-family: Figtree, sans-serif; font-weight: 600; font-size: 17px; padding: 16px 34px; border-radius: 999px; box-shadow: 0 8px 24px rgba(196, 87, 14, 0.28);" style-hover="background: #C4570E; color: #FFFCF7;">Go to homepage</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;: {&quot;width&quot;: 1440, &quot;height&quot;: 900}, &quot;tone&quot;: {&quot;editor&quot;: &quot;enum&quot;, &quot;options&quot;: [&quot;melty&quot;, &quot;plain&quot;], &quot;default&quot;: &quot;melty&quot;, &quot;tsType&quot;: &quot;\&quot;melty\&quot; | \&quot;plain\&quot;&quot;, &quot;section&quot;: &quot;Copy&quot;}, &quot;accents&quot;: {&quot;editor&quot;: &quot;boolean&quot;, &quot;default&quot;: true, &quot;tsType&quot;: &quot;boolean&quot;, &quot;section&quot;: &quot;Decoration&quot;}}">
class Component extends DCLogic {
  renderVals() {
    const tone = this.props.tone ?? "melty";
    return {
      isMelty: tone === "melty",
      isPlain: tone === "plain",
      showAccents: this.props.accents ?? true,
    };
  }
}
</script>
</body>
</html>
